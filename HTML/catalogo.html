<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Las Cabañas Pasto. Descubre nuestras cabañas, habitaciones y servicios.">
    <meta property="og:title" content="Las Cabañas Pasto — Motel">
    <meta property="og:description" content="Descubre nuestras cabañas, habitaciones y servicios en Las Cabañas Pasto.">
    <meta property="og:image" content="https://lascabanaspasto.com.co/imagenes/fondoimg4.png">
    <meta property="og:url" content="https://lascabanaspasto.com.co/HTML/catalogo.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Las Cabañas Pasto">
    <title>Catálogo de Cabañas</title>
    <link rel="icon" href="../imagenes/favicon.png">
    <link rel="stylesheet" href="../CSS/catalogo.css?v=20">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
  <div class="header-container">
    <a href="../index.html" class="logo">
      <img src="../imagenes/logo sin fondo.png" alt="Las Cabañas">
    </a>
    
    <nav class="nav">
      <a href="../index.html">Inicio</a>
      <a href="../HTML/catalogo.html">Catálogo</a>
      <a href="../HTML/contactanos.html">Contacto</a>
    </nav>
  </div>
</header>

<div class="catalogo">

  <!-- 🔍 Buscador Integrado con Botón -->
  <div class="buscador-contenedor">
    <input type="text" id="buscador" placeholder="Buscar cabaña por número o nombre...">
    <button id="btn-buscar" onclick="ejecutarBusqueda()">Buscar</button>
  </div>

  <!-- 🗂️ Categorías -->
  <div class="categorias">
    <button data-categoria="sencillas" onclick="filtrar('sencillas')"><i class="fa-solid fa-coins"></i> Sencillas</button>
    <button data-categoria="romanticas" onclick="filtrar('romanticas')"><i class="fa-solid fa-heart"></i> Románticas</button>
    <button data-categoria="jacuzzi" onclick="filtrar('jacuzzi')"><i class="fa-solid fa-bath"></i> Jacuzzi</button>
    <button data-categoria="grupales" onclick="filtrar('grupales')"><i class="fa-solid fa-users"></i> Grupales</button>
    <button data-categoria="premium" onclick="filtrar('premium')"><i class="fa-solid fa-star"></i> Premium</button>
    <button data-categoria="deluxe" onclick="filtrar('deluxe')"><i class="fa-solid fa-gem"></i> Deluxe</button>
    <button data-categoria="discapacitados" onclick="filtrar('discapacitados')"><i class="fa-solid fa-wheelchair"></i> Discapacitados</button>
    <button data-categoria="bdsm" onclick="filtrar('bdsm')"><i class="fa-solid fa-link"></i> BDSM</button>
    <button data-categoria="todas" onclick="verTodas()"><i class="fa-solid fa-house"></i> Todas</button>
  </div>

  <!-- 🏡 Título -->
  <div class="catalogo-titulo">
    <h2>Nuestras Cabañas</h2>
  </div>

  <!-- 🏡 Resultados -->
  <div id="resultados" class="resultados"></div>

  <!-- 👁 Contador de visitas -->
  <p id="contador-visitas" class="contador-visitas" hidden></p>

</div>
    
<script src="../JS/catalogo.js?v=18"></script>
</body>
</html>
